description: "星轨延时序列输出"
version: "1"

# ── 全局输入 ──
inputs:
  fnames: { type: sequence, required: true }

# ── 路由定义 ──
routes:
  mode:
    options:
      sliding_max:  SlidingWindowMaxOp
      ema_decay:    EmaDecayMaxOp
      weighted_max: WeightedSlidingWindowMaxOp
    default: sliding_max

# ── 全局配置 ──
configs:
  enable_star_shrink:     { type: bool, default: false }
  star_shrink_mode:       { type: str,  default: "moderate" }
  enable_satellite_clean: { type: bool, default: false }
  sat_window_size:        { type: int,  default: 3 }
  sat_camera_mode:        { type: str,  default: "exif" }
  sat_focal_length_mm:    { type: float, default: null }
  sat_crop_factor:        { type: float, default: 1.0 }
  mask:                   { type: str,  required: false, default: null }
  loader_type:            { type: str,  default: "img_file_list" }
  loader_configs:         { type: dict, default: {} }
  enable_sequence_export: { type: bool, default: true }
  enable_video_export: { type: bool, default: false }
  video_output_filename: { type: str, default: null }
  video_codec: { type: str, default: "h264" }
  ffmpeg_path: { type: str, default: null }
  video_fps: { type: float, default: 25.0 }
  video_width: { type: int, default: 0 }
  video_height: { type: int, default: 0 }
  video_chroma: { type: str, default: "420" }
  video_rate_control: { type: str, default: "crf" }
  video_crf: { type: float, default: 18.0 }
  video_bitrate_kbps: { type: int, default: 12000 }
  video_preset: { type: str, default: "medium" }
  video_color_range: { type: str, default: "limited" }
  video_input_color: { type: str, default: "auto" }
  output_dir:             { type: str, default: null }
  output_template:        { type: str,  default: "frame_{index:05d}.png" }
  output_dtype:           { type: str,  default: "uint8" }

# ── 路由专属配置 ──
route_configs:
  mode:
    sliding_max:
      window_size:  { type: int, default: 30 }
      buffer_mode:  { type: str, default: "memory" }
    weighted_max:
      window_size:  { type: int, default: 30 }
      fade_in:      { type: float, default: 0.3 }
      fade_out:     { type: float, default: 0.3 }
      buffer_mode:  { type: str, default: "memory" }
    ema_decay:
      half_life:    { type: int, default: 30 }

# ── 节点 ──
#
#  inputs.fnames ──► data_loader ──► satellite_clean ──► star_shrink ──► core_algo ──► batch_saver
#

nodes:
  data_loader:
    op: ImgDataLoaderOp
    inputs:
      src: inputs.fnames
    configs:
      loader_type: configs.loader_type
      configs: configs.loader_configs
    outputs:
      result: { type: sequence }

  satellite_clean:
    op: satellite_clean.yaml
    enable: configs.enable_satellite_clean
    bypass: data
    inputs:
      data: data_loader.result
      exifs: satellite_exif_loader.result
    configs:
      window_size: configs.sat_window_size
      mask: configs.mask
      camera_mode: configs.sat_camera_mode
      focal_length_mm: configs.sat_focal_length_mm
      crop_factor: configs.sat_crop_factor
    outputs:
      result: { type: sequence }

  satellite_exif_loader:
    op: ExifReadOp
    enable: configs.enable_satellite_clean
    inputs:
      fnames: inputs.fnames
    outputs:
      result: { type: sequence }

  star_shrink:
    op: StarShrinkOp
    enable: configs.enable_star_shrink
    bypass: data
    inputs:
      data: satellite_clean.result
    configs:
      mode: configs.star_shrink_mode
    outputs:
      result: { type: sequence }

  core_algo:
    route_key: mode
    label: "延时星轨核心"
    inputs:
      data: star_shrink.result
    route_configs:
      sliding_max: {}
      weighted_max: {}
      ema_decay: {}
    outputs:
      result: { type: sequence }

  batch_saver:
    op: BatchImageSaveOp
    enable: configs.enable_sequence_export
    inputs:
      data: core_algo.result
    configs:
      output_dir: configs.output_dir
      output_template: configs.output_template
      output_dtype: configs.output_dtype
    outputs:
      result: { type: sequence }

  video_exif_loader:
    op: ExifReadOp
    enable: configs.enable_video_export
    inputs: { fnames: inputs.fnames }
    outputs: { result: { type: sequence } }

  video_saver:
    op: VideoSaveOp
    enable: configs.enable_video_export
    inputs:
      data: core_algo.result
      exifs: video_exif_loader.result
    configs:
      output_filename: configs.video_output_filename
      codec: configs.video_codec
      ffmpeg_path: configs.ffmpeg_path
      fps: configs.video_fps
      width: configs.video_width
      height: configs.video_height
      chroma: configs.video_chroma
      rate_control: configs.video_rate_control
      crf: configs.video_crf
      bitrate_kbps: configs.video_bitrate_kbps
      preset: configs.video_preset
      color_range: configs.video_color_range
      input_color: configs.video_input_color
    outputs: { result: { type: object } }

# ── 全局输出 ──
outputs:
  result: { src: batch_saver.result, required: false }
  video: { src: video_saver.result, required: false }
